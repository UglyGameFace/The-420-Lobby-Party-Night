name: Import authoritative Unity settings

on:
  push:
    branches:
      - foundation/authoritative-settings-urp
    paths:
      - ".github/authoritative-settings-capture.part4.b64"
      - ".github/workflows/import-authoritative-settings.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and import Unity-generated settings
        shell: bash
        run: |
          set -euo pipefail

          cat             .github/authoritative-settings-capture.part1.b64             .github/authoritative-settings-capture.part2.b64             .github/authoritative-settings-capture.part3.b64             .github/authoritative-settings-capture.part4.b64             | base64 --decode > /tmp/party-night-settings.tar.gz

          echo "4ffe7e23d5e93b84e036e21e7e6cf24b207a529aef4bd0298cb09fce3b713f22  /tmp/party-night-settings.tar.gz" | sha256sum --check -

          rm -rf /tmp/party-night-settings
          mkdir -p /tmp/party-night-settings
          tar -xzf /tmp/party-night-settings.tar.gz -C /tmp/party-night-settings

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("/tmp/party-night-settings")
          lines = (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          checked = 0

          for line in lines:
              if (
                  not line
                  or line.startswith("Party Night")
                  or line.startswith("Unity:")
                  or line.startswith("Files:")
              ):
                  continue

              expected, relative = line.split("  ", 1)
              path = root / relative
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"checksum mismatch: {relative}")
              checked += 1

          if checked != 16:
              raise SystemExit(f"expected 16 captured files, verified {checked}")
          PY

          cmp /tmp/party-night-settings/ProjectSettings/ProjectVersion.txt ProjectSettings/ProjectVersion.txt
          cmp /tmp/party-night-settings/ProjectSettings/EditorBuildSettings.asset ProjectSettings/EditorBuildSettings.asset

          mkdir -p Assets/PartyNight/Settings
          cp /tmp/party-night-settings/Assets/PartyNight/Settings.meta Assets/PartyNight/Settings.meta
          cp /tmp/party-night-settings/Assets/PartyNight/Settings/* Assets/PartyNight/Settings/
          cp /tmp/party-night-settings/Packages/packages-lock.json Packages/packages-lock.json
          cp /tmp/party-night-settings/ProjectSettings/EditorSettings.asset ProjectSettings/EditorSettings.asset
          cp /tmp/party-night-settings/ProjectSettings/GraphicsSettings.asset ProjectSettings/GraphicsSettings.asset
          cp /tmp/party-night-settings/ProjectSettings/ProjectSettings.asset ProjectSettings/ProjectSettings.asset
          cp /tmp/party-night-settings/ProjectSettings/QualitySettings.asset ProjectSettings/QualitySettings.asset

          rm -f             .github/authoritative-settings-capture.part1.b64             .github/authoritative-settings-capture.part2.b64             .github/authoritative-settings-capture.part3.b64             .github/authoritative-settings-capture.part4.b64             .github/workflows/import-authoritative-settings.yml

          git config user.name "Party Night CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "build: import Unity-generated authoritative settings"
          git push origin HEAD:foundation/authoritative-settings-urp
