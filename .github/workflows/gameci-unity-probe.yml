name: Unity GameCI Zero-DevOps Probe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/gameci-unity-probe
    paths:
      - .github/gameci-trigger

permissions:
  contents: read

jobs:
  unity-probe:
    name: Real Unity validation probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FROZEN_PR10_SHA: 4a12c1ff911868e522d7d439cd996d91434440bb
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Check out exact frozen PR #10 head
        uses: actions/checkout@v4
        with:
          ref: 4a12c1ff911868e522d7d439cd996d91434440bb
          fetch-depth: 0

      - name: Prove exact revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "GAMECI_FROZEN_REVISION=$actual"
          test "$actual" = "$FROZEN_PR10_SHA"

      - name: Prove pinned Unity editor version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "m_EditorVersion: 6000.3.24f1" ProjectSettings/ProjectVersion.txt
          grep -Fx "m_EditorVersionWithRevision: 6000.3.24f1 (4e7b9b5b6244)" ProjectSettings/ProjectVersion.txt
          echo "GAMECI_PINNED_UNITY_VERSION=PASS"

      - name: Unity Personal license preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::GameCI cannot launch real Unity until the three Unity Personal secrets are configured."
            exit 1
          fi
          echo "Unity credential preflight passed. Secret values are intentionally not printed."

      - name: Run real Unity Edit + Play Mode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: all
          coverageEnabled: false
          artifactsPath: artifacts

      - name: Build Linux Player with real Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ env.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ env.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.24f1
          targetPlatform: StandaloneLinux64
          buildsPath: build
          buildName: PartyNightGameCIProbe

      - name: Create compact validation proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-proof

          unity_player="$(find build -type f -name 'UnityPlayer.so' -print -quit)"
          executable="$(find build -type f -name '*.x86_64' -print -quit)"

          test -n "$unity_player"
          test -n "$executable"

          {
            echo "revision=$(git rev-parse HEAD)"
            echo "unity_version=6000.3.24f1"
            echo "unity_player=$unity_player"
            echo "unity_player_bytes=$(stat -c%s "$unity_player")"
            echo "unity_player_sha256=$(sha256sum "$unity_player" | awk '{print $1}')"
            echo "linux_executable=$executable"
            echo "linux_executable_bytes=$(stat -c%s "$executable")"
            echo "linux_executable_sha256=$(sha256sum "$executable" | awk '{print $1}')"
          } > validation-proof/BUILD_PROOF.txt

          if [ -d VisualValidation ]; then
            cp -a VisualValidation/. validation-proof/
          fi

          if [ -d artifacts ]; then
            find artifacts -type f \( -name '*.xml' -o -name '*.json' -o -name '*.txt' \) \
              -exec cp --parents {} validation-proof/ \;
          fi

          echo "=== VALIDATION PROOF ==="
          cat validation-proof/BUILD_PROOF.txt

      - name: Upload compact validation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameci-validation-proof
          path: validation-proof
          if-no-files-found: warn
          retention-days: 1

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gameci-failure-diagnostics
          path: |
            artifacts
            Logs
            VisualValidation
          if-no-files-found: warn
          retention-days: 1
