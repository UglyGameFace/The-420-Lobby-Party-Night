name: Party Night License-Free Shadow Runtime

on:
  push:
    branches:
      - ci/gameci-unity-probe
    paths:
      - ci/shadow/**
      - .github/workflows/shadow-runtime-probe.yml

permissions:
  contents: read

jobs:
  shadow-runtime:
    name: Compile + execute frozen movement source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out shadow harness
        uses: actions/checkout@v4
        with:
          ref: ci/gameci-unity-probe
          path: probe

      - name: Check out exact frozen PR #10 source
        uses: actions/checkout@v4
        with:
          ref: 4a12c1ff911868e522d7d439cd996d91434440bb
          path: project

      - name: Prove frozen source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C project rev-parse HEAD)"
          echo "SHADOW_FROZEN_REVISION=$actual"
          test "$actual" = "4a12c1ff911868e522d7d439cd996d91434440bb"

      - name: Copy exact production sources into shadow compile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probe/ci/shadow/Source
          mkdir -p probe/ci/shadow/Source

          cp project/Assets/PartyNight/Gameplay/Runtime/PartyNightCharacterMotor.cs \
             probe/ci/shadow/Source/
          cp project/Assets/PartyNight/Gameplay/Runtime/PartyNightNetworkMovement.cs \
             probe/ci/shadow/Source/
          cp project/Assets/PartyNight/Networking/Runtime/PartyNightNetworkPlayer.cs \
             probe/ci/shadow/Source/

          echo "=== PRODUCTION SOURCE HASHES ==="
          sha256sum probe/ci/shadow/Source/*.cs

      - name: Compile actual Party Night source against strict shadow API
        shell: bash
        run: |
          set -euo pipefail
          dotnet build probe/ci/shadow/PartyNight.Shadow.csproj \
            --configuration Release \
            --nologo

      - name: Execute authoritative movement shadow tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet run \
            --project probe/ci/shadow/PartyNight.Shadow.csproj \
            --configuration Release \
            --no-build
